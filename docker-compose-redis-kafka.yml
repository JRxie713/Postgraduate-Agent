# ============================================================================
# 学习打卡模块依赖中间件：Kafka（单机 KRaft 模式，无需 ZooKeeper）
# Redis 默认复用本机已有的 Docker 容器（如 kaoyan-redis:6379），不再重复创建；
# 若本机没有 Redis，再按下方说明启动 redis 服务。
#
# 启动 Kafka（在 Ubuntu / WSL 里执行，注意 compose 文件在 Windows D 盘，
# WSL 中路径为 /mnt/d/Postgraduate-Agent/...）：
#   docker compose -f /mnt/d/Postgraduate-Agent/docker-compose-redis-kafka.yml up -d kafka
#
# 顺带启动一个独立 Redis（仅当本机没有可用 Redis 时）：
#   docker compose -f /mnt/d/Postgraduate-Agent/docker-compose-redis-kafka.yml --profile redis up -d redis
#
# 停止 / 清理：
#   docker compose -f /mnt/d/Postgraduate-Agent/docker-compose-redis-kafka.yml down
#   docker compose -f /mnt/d/Postgraduate-Agent/docker-compose-redis-kafka.yml down -v
#
# 注意：如果后端不在这台 Ubuntu 本机运行（例如后端在 Windows、Kafka 在局域网 Ubuntu），
# 需要把 KAFKA_ADVERTISED_LISTENERS 中的地址改成 Ubuntu 的实际 IP，
# 例如 PLAINTEXT://192.168.3.20:9092，否则客户端连上后拿到的 advertised 地址不可达。
# WSL2 本机回环转发正常时，保持 127.0.0.1:9092 即可。
# ============================================================================

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: demo-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # 本机访问用 127.0.0.1；跨机器访问改为 Ubuntu 的局域网 IP
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 单机副本数设为 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/tmp/kraft-combined-logs

  # 可选 Redis：只有本机没有可用 Redis 时，用 --profile redis 显式启动
  redis:
    image: redis:7-alpine
    container_name: demo-redis
    profiles: ["redis"]
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    # 如需密码，取消下一行注释并把 requirepass 后面改成自己的密码，
    # 同时在 backend/.env 里配置 REDIS_PASSWORD
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  kafka-data:
  redis-data:
