server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kaoyan?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      initialization-fail-timeout: -1

  data:
    redis:
      host: 127.0.0.1
      port: 6380
      database: 0
      timeout: 3000

  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.demo.scaffoldbackend.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 安全与认证配置
security:
  jwt:
    secret: ${JWT_SECRET:change-me-please-use-a-long-32-bytes-secret-key}
    access-expire: 7200        # 访问令牌有效期（秒），2h
    refresh-expire: 604800     # 刷新令牌有效期（秒），7d
  captcha:
    enabled: false             # 登录图形验证码（预留，登录DTO未含验证码字段，暂关）
  login:
    max-fail: 5                # 连续失败锁定阈值
    lock-minutes: 10           # 锁定时长（分钟）
  rate-limit:
    enabled: true
    global-per-minute: 60      # 单IP每分钟请求上限
    block-threshold: 300       # 单窗口内超过该值加入黑名单
    block-minutes: 10          # 黑名单封禁时长（分钟）
    ua-check-enabled: false    # 无UA拦截（默认关，避免误伤）
logging:
  level:
    com.zaxxer.hikari: DEBUG
    com.mysql.cj: DEBUG