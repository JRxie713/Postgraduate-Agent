server:
  port: 8080

spring:
  servlet:
    multipart:
      # 单次上传的文件大小上限
      max-file-size: 100MB
      # 单次请求的总大小上限
      max-request-size: 100MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/pg_agent?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: your_password
    hikari:
      initialization-fail-timeout: -1

  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    timeout: 3000

  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.demo.scaffoldbackend.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ===== Shiro 配置（临时关闭，由后续队员开启并完善） =====
shiro:
  enabled: false

# ===== 文件上传配置 =====
file:
  upload:
    # 文件实际存到磁盘的目录（相对项目启动目录）
    root: ./data/upload
