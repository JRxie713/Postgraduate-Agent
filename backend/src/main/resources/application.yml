server:
  port: 8080

spring:
  # 本地敏感配置从 .env 读取（该文件已被 .gitignore 忽略，不提交）
  # 支持在项目根目录或 backend 目录启动；队友复制 backend/.env.example 为 backend/.env 后填写
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./backend/.env[.properties]

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:${DB_PORT:3307}/kaoyan?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      initialization-fail-timeout: -1

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3000

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

  # QQ 邮箱 SMTP：MAIL_USERNAME 填你的 QQ 邮箱，MAIL_AUTH_CODE 填 QQ 邮箱生成的 16 位授权码
  # 未配置时验证码只打印到后端日志（[MAIL-MOCK]），不会真正发信
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_AUTH_CODE}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.demo.scaffoldbackend.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 安全与认证配置
security:
  jwt:
    secret: ${JWT_SECRET}
    access-expire: 7200        # 访问令牌有效期（秒），2h
    refresh-expire: 604800     # 刷新令牌有效期（秒），7d
  captcha:
    enabled: ${CAPTCHA_ENABLED:true}   # 登录图形验证码，本地接口联调可在 .env 里临时关掉
    expire-seconds: 120        # 验证码有效期（秒），一次性使用
  login:
    max-fail: 5                # 连续失败锁定阈值
    lock-minutes: 1            # 锁定时长（分钟）
  sms:
    expire-seconds: 300        # 短信验证码有效期（秒）
    cooldown-seconds: 60       # 同一手机号重发冷却（秒）
    expose-code: false         # 验证码只写入 Redis 和后端日志，不回显到网页；联调可从 Redis 读取
  email:
    expire-seconds: 300        # 邮箱验证码有效期（秒）
    cooldown-seconds: 60       # 同一邮箱重发冷却（秒）
  rate-limit:
    enabled: true
    global-per-minute: 60      # 单IP每分钟请求上限
    block-threshold: 300       # 单窗口内超过该值加入黑名单
    block-minutes: 10          # 黑名单封禁时长（分钟）
    ua-check-enabled: false    # 无UA拦截（默认关，避免误伤）
logging:
  level:
    com.zaxxer.hikari: DEBUG
    com.mysql.cj: DEBUG